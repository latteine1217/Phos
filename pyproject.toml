[project]
name = "phos"
version = "0.8.0"
description = "Film photography simulation with physically-accurate models"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Latteine" }
]

dependencies = [
    "numpy>=2.2.0",
    "opencv-python-headless>=4.12.0",
    "pillow>=12.0.0",
    "pyside6>=6.9.0",
]

[project.scripts]
phos = "phos_desktop_app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "psutil>=5.9.8",
]
desktop = [
    "pyinstaller>=6.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "psutil>=5.9.8",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_refactored"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
